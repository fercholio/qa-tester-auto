## 1. Contexto Global del Sistema
- **Nombre del Proyecto / Módulo:** \`Tempus V2 - Módulo de Captura de Tiempo (Time Tracker)\`
- **Roles Existentes:** \`Super-Admin\`, \`Tenant-Admin\`, \`Manager\`, \`Empleado\`
- **Precondiciones Globales de la Suite:**  
  - El usuario debe estar autenticado y haber seleccionado el tenant activo.  
  - La base de datos debe estar seedeada con al menos un \`Project\`, \`Task\`, y \`Tag\`.  
  - El usuario debe tener permiso de \`Empleado\` para registrar tiempo (o \`Manager\`/\`Tenant-Admin\` con permisos de creación de registros).  
  - El motor de IA (Groq) debe estar disponible y autenticado.

## 2. Especificación de Requerimientos y Casos de Prueba

### RF-5.1 - Captura Híbrida
- **Descripción del Negocio:** El usuario puede registrar actividades de tiempo de forma manual o mediante comandos de voz (Speech‑to‑Text).
- **Precondiciones Específicas:**  
  - El usuario está en la vista de “Registrar Tiempo” (Timesheet).  
  - El micrófono del dispositivo está habilitado y tiene permiso de acceso.
- **Roles Autorizados:** \`Empleado\`, \`Manager\` (con permiso de creación de registros).

#### 🛠️ Secuencia de Acciones (Happy Path)
1. Navegar a \`/timesheet/new\`.
2. Hacer clic en el botón “Agregar actividad manual”.
3. Llenar los campos: \`Descripción\`, \`Duración\`, \`Proyecto\`, \`Tarea\`, \`Billable\`, \`Tags\`.
4. Hacer clic en “Guardar”.
5. **Opción de voz:**  
   1. Hacer clic en el icono de micrófono.  
   2. Pronunciar la descripción y duración (ej. “Reunión con cliente 2 horas”).  
   3. Confirmar la transcripción y guardar.

#### ✅ Aserciones Esperadas (Asserts)
- [ ] **UI:** Se muestra el formulario con todos los campos visibles y el botón “Guardar” habilitado.  
- [ ] **Comportamiento:** Al guardar, el registro aparece en la lista de actividades con la duración correcta y la descripción transcrita.  
- [ ] **Comportamiento (voz):** El micrófono inicia la grabación, la transcripción se muestra en tiempo real y el botón “Guardar” se habilita solo cuando la transcripción no está vacía.

#### ⚠️ Escenarios de Borde (Edge Cases / Negative Paths)
- **Caso A:** Micrófono no disponible.  
  - **Aserción:** Se muestra un mensaje de error “Micrófono no accesible” y el botón de grabación queda deshabilitado.  
- **Caso B:** El usuario intenta guardar sin completar la duración.  
  - **Aserción:** Se muestra un mensaje de validación “La duración es obligatoria” y el registro no se guarda.

### RF-5.2 - Inferencia con IA

- **Precondiciones Específicas:**  
  - El usuario está en la vista de “Registrar Tiempo” con el campo de descripción visible.  
  - El motor de IA está activo y la API de Groq responde.
- **Roles Autorizados:** \`Empleado\`, \`Manager\`.

#### 🛠️ Secuencia de Acciones (Happy Path)
1. Navegar a \`/timesheet/new\`.
2. Ingresar en el campo de descripción: “Reunión con el equipo de ventas”.
3. Esperar a que el motor de IA procese y sugiera:  
   - Tipo: \`Valor\`  
   - Duración sugerida: \`1.5h\`
4. Confirmar la sugerencia y guardar el registro.

#### ✅ Aserciones Esperadas (Asserts)
- [ ] **UI:** Se muestra un banner o tooltip con la clasificación (\`Valor\`/\`Administrativa\`) y la duración sugerida.  
- [ ] **Comportamiento:** Al confirmar, el campo de duración se rellena automáticamente con la sugerencia y el tipo de actividad se marca correctamente.  
- [ ] **Persistencia:** El registro guardado muestra la clasificación y duración exactas en la lista de actividades.

#### ⚠️ Escenarios de Borde (Edge Cases / Negative Paths)
- **Caso A:** El motor de IA devuelve una clasificación nula o error.  
  - **Aserción:** Se muestra un mensaje “No se pudo clasificar la actividad” y el usuario debe completar manualmente los campos.  
- **Caso B:** La duración sugerida excede el límite diario permitido por el plan.  
  - **Aserción:** Se muestra una advertencia “Duración excede el límite diario” y el usuario puede ajustar manualmente.

---

### RF-5.3 - Proyectos y Tareas Recurrentes
- **Descripción del Negocio:** El sistema mantiene un catálogo de \`Projects\` y \`Tasks\` que los usuarios pueden seleccionar para tareas repetitivas, garantizando consistencia semántica en los reportes.
- **Precondiciones Específicas:**  
  - Existe al menos un proyecto y una tarea en la base de datos.  
  - El usuario tiene permiso para ver y seleccionar proyectos/tareas.
- **Roles Autorizados:** \`Empleado\`, \`Manager\`, \`Tenant-Admin\`.

#### 🛠️ Secuencia de Acciones (Happy Path)
1. Navegar a \`/timesheet/new\`.
2. Hacer clic en el selector de proyecto y elegir “Proyecto X”.
3. Hacer clic en el selector de tarea y elegir “Reunión de seguimiento”.
4. Llenar los demás campos y guardar.

#### ✅ Aserciones Esperadas (Asserts)
- [ ] **UI:** Los dropdowns de proyecto y tarea muestran las opciones disponibles y se actualizan dinámicamente según el proyecto seleccionado.  
- [ ] **Comportamiento:** Al guardar, el registro almacena la referencia al proyecto y tarea seleccionados.  
- [ ] **Reportes:** Los informes de tiempo muestran la actividad bajo el proyecto y tarea correctos, sin variaciones de texto.

#### ⚠️ Escenarios de Borde (Edge Cases / Negative Paths)
- **Caso A:** El proyecto seleccionado no tiene tareas asociadas.  
  - **Aserción:** Se muestra un mensaje “No hay tareas disponibles para este proyecto” y el selector de tarea queda deshabilitado.  
- **Caso B:** El usuario intenta crear una tarea que ya existe con el mismo nombre.  
  - **Aserción:** Se muestra una advertencia “La tarea ya existe” y se sugiere seleccionar la existente.

---

### RF-5.4 - Paridad de Formularios de Entrada
- **Descripción del Negocio:** Todas las interfaces de captura (Semanal, Manual, Lote) deben mantener consistencia de campos, permitiendo marcar el registro como “Facturable” y asignar “Etiquetas” de forma unificada.
- **Precondiciones Específicas:**  
  - El usuario está en cualquiera de las vistas de captura (semana, manual, lote).  
  - Los campos de “Facturable” y “Etiquetas” están disponibles en cada formulario.
- **Roles Autorizados:** \`Empleado\`, \`Manager\`.

#### 🛠️ Secuencia de Acciones (Happy Path)
1. Navegar a \`/timesheet/weekly\`.
2. Seleccionar una actividad y marcar la casilla “Facturable”.
3. Añadir la etiqueta “Reunión” usando el selector de tags.
4. Guardar la hoja de tiempo.
5. Repetir el proceso en la vista de “Tracker Manual” y “Edición en Lote” con los mismos pasos.

#### ✅ Aserciones Esperadas (Asserts)
- [ ] **UI:** Los formularios de todas las vistas muestran los mismos campos: \`Descripción\`, \`Duración\`, \`Proyecto\`, \`Tarea\`, \`Facturable\`, \`Etiquetas\`.  
- [ ] **Comportamiento:** Al marcar “Facturable” y asignar tags, el registro guarda estos atributos correctamente.  
- [ ] **Persistencia:** Los registros guardados aparecen con el flag \`billable = true\` y la lista de tags asociadas en la base de datos.

#### ⚠️ Escenarios de Borde (Edge Cases / Negative Paths)
- **Caso A:** El usuario intenta marcar “Facturable” sin seleccionar un proyecto.  
  - **Aserción:** Se muestra una validación “Selecciona un proyecto antes de marcar como facturable”.  
- **Caso B:** Se intenta asignar una etiqueta que no existe en el catálogo.  
  - **Aserción:** Se muestra un mensaje “Etiqueta no válida” y el usuario debe elegir una etiqueta existente.
