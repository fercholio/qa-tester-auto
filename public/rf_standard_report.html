## 1. Contexto Global del Sistema

- **Nombre del Proyecto / Módulo:** \`Tempus V2 – Módulo Multi‑Tenant (SaaS Interno)\`
- **Roles Existentes:** \`Super‑Admin\`, \`Tenant‑Admin\`, \`Tenant‑User\`
- **Precondiciones Globales de la Suite:**  
  - La base de datos está seedeada con al menos un tenant y un super‑admin.  
  - El super‑admin está autenticado y tiene acceso a todas las rutas de administración.  
  - Los usuarios de cada tenant están autenticados con credenciales válidas.  
  - No se utilizan datos de prueba estáticos ni mocks en la capa de UI.

---

## 2. Especificación de Requerimientos y Casos de Prueba

### RF‑1.1 – Super‑Administrador

- **Descripción del Negocio:**  
  El sistema debe contar con un único rol de Super‑Admin (Dueño de Tempus) que no puede ser transferido ni duplicado.
- **Precondiciones Específicas:**  
  - Se ha creado un super‑admin durante el seed inicial.  
  - No existen otros usuarios con el rol \`super_admin\`.
- **Roles Autorizados:**  
  - \`Super‑Admin\` (solo él puede verificar y crear el rol).
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Navegar a \`/admin/roles\`.
  2. Verificar que solo aparece el rol \`super_admin\`.
  3. Intentar crear un nuevo rol \`super_admin\` mediante el formulario.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** Se muestra un mensaje de error “Rol \`super_admin\` ya existe” y el botón de crear está deshabilitado.  
  - **Comportamiento:** La base de datos no contiene más de un registro con \`role = 'super_admin'\`.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** Un usuario con rol \`tenant_admin\` intenta crear el rol \`super_admin\`.  
    - **Aserción:** El sistema devuelve un error 403 y no crea el rol.

---

### RF‑1.2 – Creación de Inquilinos (Tenants)

- **Descripción del Negocio:**  
  Solo el Super‑Admin puede dar de alta nuevos tenants (empresas clientes).
- **Precondiciones Específicas:**  
  - El super‑admin está autenticado y en la vista de administración de tenants.
- **Roles Autorizados:**  
  - \`Super‑Admin\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Navegar a \`/admin/tenants/create\`.
  2. Llenar el formulario con \`name = "ILCO"\`, \`email = "contact@ilco.com"\`.
  3. Hacer clic en “Crear Tenant”.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** Se muestra un toast “Tenant creado exitosamente”.
  - **Comportamiento:** La tabla de tenants incluye una nueva fila con el nombre “ILCO”.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** Un \`tenant_admin\` intenta acceder a \`/admin/tenants/create\`.  
    - **Aserción:** Se muestra una página 403 y el botón de crear no está disponible.

---

### RF‑1.3 – Asignación de Límites

- **Descripción del Negocio:**  
  Al crear un tenant, el super‑admin debe asignarle un plan, una suscripción y un registro de uso (\`UsageRecord\`) que defina cuotas máximas de usuarios y consumo de tokens de IA.
- **Precondiciones Específicas:**  
  - Los planes (\`Starter\`, \`Professional\`, \`Enterprise\`) están seedeados.  
  - El super‑admin está en la pantalla de creación de tenant.
- **Roles Autorizados:**  
  - \`Super‑Admin\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. En la pantalla de creación de tenant, seleccionar el plan \`Professional\`.
  2. Confirmar la suscripción y crear el tenant.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** El plan seleccionado aparece en la vista de detalle del tenant.  
  - **Comportamiento:** La tabla \`usage_records\` contiene un registro con \`tenant_id\` del nuevo tenant y los límites correspondientes.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** Intentar crear un tenant sin seleccionar un plan.  
    - **Aserción:** El formulario muestra un error “Plan es obligatorio” y no crea el tenant.

---

### RF‑1.4 – Aislamiento Lógico

- **Descripción del Negocio:**  
  Todos los datos generados (registros de tiempo, usuarios, organigrama, reportes) deben estar estrictamente aislados mediante el \`tenant_id\`.
- **Precondiciones Específicas:**  
  - Existen al menos dos tenants con usuarios y datos asociados.  
  - El usuario autenticado pertenece a un tenant específico.
- **Roles Autorizados:**  
  - \`Tenant‑Admin\`, \`Tenant‑User\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Iniciar sesión como \`tenant_admin\` del Tenant A.
  2. Navegar a \`/timesheets\`.
  3. Verificar que la lista solo muestra registros del Tenant A.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** No aparecen registros de otros tenants.  
  - **Comportamiento:** Una llamada a \`/api/timesheets\` devuelve solo datos con \`tenant_id = A\`.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** Un \`tenant_admin\` intenta acceder a \`/api/timesheets?tenant_id=B\`.  
    - **Aserción:** El API devuelve 403 y no muestra datos de Tenant B.

---

### RF‑1.5 – Selector de Contexto (Tenant Switcher)

- **Descripción del Negocio:**  
  Si un usuario pertenece a múltiples corporativos, la interfaz global debe proveer un selector visible que permita cambiar la organización activa en sesión.
- **Precondiciones Específicas:**  
  - El usuario autenticado tiene asignados al menos dos tenants.  
  - El selector está visible en el \`AppLayout\`.
- **Roles Autorizados:**  
  - \`Super‑Admin\`, \`Tenant‑Admin\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Iniciar sesión como \`super_admin\` con acceso a Tenant X y Y.
  2. Verificar la presencia del dropdown \`#tenant-switcher\`.
  3. Seleccionar \`Tenant Y\` y confirmar que la URL cambia a \`/tenant/Y\`.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** El dropdown muestra ambos tenants y su selección actual se resalta.  
  - **Comportamiento:** Todas las peticiones subsiguientes incluyen \`tenant_id = Y\`.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** Un usuario con un solo tenant no ve el selector.  
    - **Aserción:** El elemento \`#tenant-switcher\` no está presente en el DOM.

---

### RF‑1.6 – Validación de Plan en Inicio de Sesión

- **Descripción del Negocio:**  
  Si el tenant de un usuario no tiene un plan asignado, el sistema bloquea el inicio de sesión (excepto para super‑admin) y notifica al dueño de Tempus.
- **Precondiciones Específicas:**  
  - Existe un tenant sin plan (\`plan_id = null\`).  
  - Un usuario de ese tenant intenta iniciar sesión.
- **Roles Autorizados:**  
  - \`Tenant‑User\`, \`Tenant‑Admin\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Navegar a \`/login\`.
  2. Ingresar credenciales del usuario del tenant sin plan.
  3. Hacer clic en “Entrar”.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** Se muestra un modal “Su empresa no tiene un plan activo”.  
  - **Comportamiento:** El usuario no es autenticado y la sesión no se crea.  
  - **Notificación:** Se envía un correo interno al super‑admin.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** El usuario es \`super_admin\`.  
    - **Aserción:** El login procede sin restricciones y no se envía notificación.

---

### RF‑1.7 – Workspace Selection Gate (Pantalla de Inmersión)

- **Descripción del Negocio:**  
  Tras un login exitoso, si el usuario administra múltiples corporativos, se muestra un modal obligatorio para seleccionar el tenant de trabajo.
- **Precondiciones Específicas:**  
  - El usuario autenticado es \`tenant_admin\` con acceso a más de un tenant.  
  - La sesión está activa.
- **Roles Autorizados:**  
  - \`Tenant‑Admin\`, \`Super‑Admin\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Iniciar sesión como \`tenant_admin\` con múltiples tenants.
  2. Verificar que aparece un modal centrado a pantalla completa.
  3. Seleccionar un tenant y confirmar.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** El modal bloquea la interacción con el sidebar hasta la selección.  
  - **Comportamiento:** Tras la selección, el sidebar se inicializa y la navegación continúa.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** El usuario tiene solo un tenant.  
    - **Aserción:** No aparece el modal y la navegación se inicia inmediatamente.

---

### RF‑1.8 – Planes SaaS (Características y Límites)

- **Descripción del Negocio:**  
  El sistema soporta tres niveles de suscripción (Starter, Professional, Enterprise). Las características y límites se almacenan como JSON y se renderizan dinámicamente en la vista de facturación.
- **Precondiciones Específicas:**  
  - Los planes están seedeados con sus \`features\` y \`limits\`.  
  - Un tenant con plan activo está autenticado.
- **Roles Autorizados:**  
  - \`Tenant‑Admin\`, \`Super‑Admin\`
- #### 🛠️ Secuencia de Acciones (Happy Path)
  1. Navegar a \`/billing\`.
  2. Verificar que la tabla de características muestra los valores del plan actual.
  3. Comparar el uso actual (\`usage_records\`) con los límites.
- #### ✅ Aserciones Esperadas (Asserts)
  - **UI:** Los campos \`max_users\`, \`ai_reviews\` se muestran correctamente y se comparan con el uso actual.  
  - **Comportamiento:** Si el uso excede el límite, se muestra una advertencia.
- #### ⚠️ Escenarios de Borde
  - **Caso A:** Un tenant intenta crear más usuarios que su límite \`max_users\`.  
    - **Aserción:** El formulario de creación de usuarios muestra un error “Límite de usuarios alcanzado”.
